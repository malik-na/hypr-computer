\* check: SessionLifecycle liveness ResourcesEventuallyReleased
\* Past bug: cleanup is left to the process that is dying. TLC must report ResourcesEventuallyReleased.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    HandOffEarly = FALSE
    CleanupDependsOnDyingProcess = TRUE

INVARIANTS
    TypeOK
    ToolCallOnlyOnReadyScreen
    NoScreenWithoutSession
    NoSessionWithoutAgent
    TeardownAtMostOnce
    DaemonNeverStuck

PROPERTIES
    SessionsAreIndependent
    ResourcesEventuallyReleased
    StartingSessionBecomesReady
