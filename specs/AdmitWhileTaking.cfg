\* check: TakeOver liveness TakeOverTakesEffect
\* Bug: the guard lets calls through until the user has the screen, so a busy agent keeps the user out. TLC must report TakeOverTakesEffect.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    TakeOverMidCall = FALSE
    AdmitWhileTaking = TRUE
    EscapeForgetsWaitingCall = FALSE
    ClipboardKeptOnHandBack = FALSE
    EndKeepsTakeOver = FALSE

INVARIANTS
    TypeOK
    AgentAndUserNeverInterleave
    WaitingOnlyWhileTakenOver
    ResumedAtMostOnce
    ClipboardOnlyDuringTakeOver
    OneTakeOverAtATime
    EndedSessionLeavesNothing

PROPERTIES
    SessionsAreIndependent
    OnlyTheUserHandsBack
    OnlyTheUserTakesOver
    TakeOverTakesEffect
