\* Past bug: the notice is closed when its session ends, and Omarchy's shell keeps it. TLC must report NoNoticeOutlivesItsSession.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    CloseOnEnd = TRUE
    ForgetLateAnswer = FALSE
    WaitForever = FALSE
    StopStopsAll = FALSE

INVARIANTS
    TypeOK
    AtMostOneNotice
    NoNoticeOutlivesItsSession
    StopOnlyItsOwn

PROPERTIES
    StopOnlyLive
    UserIsTold
    NoticeGoes
    StopTakesEffect

\* Each session opens and ends once at most, so a run can end: that is not a deadlock.
CHECK_DEADLOCK FALSE
