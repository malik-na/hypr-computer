\* Bug: The profile is released when the agent disconnects, before its browser has shut down. TLC must report OneBrowserPerProfile.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    Profiles = {p1, p2}
    TwoSessionsBothAcquire = FALSE
    ReleaseAtDisconnect = TRUE
    LockNotHeldByBrowser = FALSE
    DeleteInUse = FALSE

INVARIANTS
    TypeOK
    OneBrowserPerProfile
    NoBrowserOnDeletedProfile
    BrowserOnItsOwnProfile
    HolderChoseIt

PROPERTIES
    OneProfilePerSession
    ProfilesStayUntilDeleted
    SessionsAreIndependent
    EndedSessionReleases
    OpenAnswers
    OrphanedProfileFreed
