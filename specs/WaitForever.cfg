\* Past bug: the daemon waits for a hung notification service forever, and no notice appears. TLC must report UserIsTold.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    CloseOnEnd = FALSE
    ForgetLateAnswer = FALSE
    WaitForever = TRUE
    StopStopsAll = FALSE

INVARIANTS
    TypeOK
    AtMostOneNotice
    NoNoticeOutlivesItsSession
    StopOnlyItsOwn

PROPERTIES
    StopOnlyLive
    UserIsTold
    NoticeGoes
    StopTakesEffect

\* Each session opens and ends once at most, so a run can end: that is not a deadlock.
CHECK_DEADLOCK FALSE
