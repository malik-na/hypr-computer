\* Past bug (v0.8, fde9289, fixed in e6d3101): a password manager's window is painted over only if it was there when the capture began. TLC must report PasswordManagerNeverShown.
SPECIFICATION Spec

CONSTANTS
    Apps = {"notes", "vault"}
    Vaults = {"vault"}
    Browser = "browser"
    Sites = {"s1", "s2"}
    MaxTime = 1
    LimitsReadAtConnect = FALSE
    ExpiredLimitStillApplies = FALSE
    CheckOnlyRequestedUrl = FALSE
    HideOnlyBeforeCapture = TRUE

INVARIANTS
    TypeOK
    CallsKeepToLimits
    RefusedOnlyIfForbidden
    OnlyListedSitesReached
    PasswordManagerNeverShown
    PasswordManagerNeverUsed
    ReadOnlyOnlyLooks
    BrowserOnlyThroughOpenUrl
    NoLimitAllowsAll
