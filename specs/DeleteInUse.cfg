\* Bug: `hypr-computer profile delete` removes a profile a browser is using. TLC must report NoBrowserOnDeletedProfile.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    Profiles = {p1, p2}
    TwoSessionsBothAcquire = FALSE
    ReleaseAtDisconnect = FALSE
    LockNotHeldByBrowser = FALSE
    DeleteInUse = TRUE

INVARIANTS
    TypeOK
    OneBrowserPerProfile
    NoBrowserOnDeletedProfile
    BrowserOnItsOwnProfile
    HolderChoseIt

PROPERTIES
    OneProfilePerSession
    ProfilesStayUntilDeleted
    SessionsAreIndependent
    EndedSessionReleases
    OpenAnswers
    OrphanedProfileFreed
