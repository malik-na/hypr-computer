\* Past bug: a session that ends before its notice's id comes forgets it, and the notice stays. TLC must report NoNoticeOutlivesItsSession.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    CloseOnEnd = FALSE
    ForgetLateAnswer = TRUE
    WaitForever = FALSE
    StopStopsAll = FALSE

INVARIANTS
    TypeOK
    AtMostOneNotice
    NoNoticeOutlivesItsSession
    StopOnlyItsOwn

PROPERTIES
    StopOnlyLive
    UserIsTold
    NoticeGoes
    StopTakesEffect

\* Each session opens and ends once at most, so a run can end: that is not a deadlock.
CHECK_DEADLOCK FALSE
