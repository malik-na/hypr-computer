\* check: Stop invariant NoCallServedWhileStopped
\* Past bug: the stop is checked only when a call starts, so a drag let through before it goes on. TLC must report NoCallServedWhileStopped.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    Moves = 2
    CheckStopOnlyAtStart = TRUE

INVARIANTS
    TypeOK
    NoCallServedWhileStopped
    StoppedMeansReleased
    OnlyInputHolds
    StoppedScreenStays
    RunningSessionServes

PROPERTIES
    SessionsAreIndependent
    StopAllHoldsForNewAgents
    OnlyDisconnectEndsScreen
    StopTakesEffect
    StoppedInputIsReleased
