\* Past behaviour (v0.8, d7f3efe): once a limit's time was up, agents could only read the screen. TLC must report RefusedOnlyIfForbidden.
SPECIFICATION Spec

CONSTANTS
    Apps = {"notes", "vault"}
    Vaults = {"vault"}
    Browser = "browser"
    Sites = {"s1", "s2"}
    MaxTime = 1
    LimitsReadAtConnect = FALSE
    ExpiredLimitStillApplies = TRUE
    CheckOnlyRequestedUrl = FALSE
    HideOnlyBeforeCapture = FALSE

INVARIANTS
    TypeOK
    CallsKeepToLimits
    RefusedOnlyIfForbidden
    OnlyListedSitesReached
    PasswordManagerNeverShown
    PasswordManagerNeverUsed
    ReadOnlyOnlyLooks
    BrowserOnlyThroughOpenUrl
    NoLimitAllowsAll
