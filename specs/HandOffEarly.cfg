\* check: SessionLifecycle invariant ToolCallOnlyOnReadyScreen
\* Past bug: the screen is handed to the agent before it is verified ready. TLC must report ToolCallOnlyOnReadyScreen.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1}
    HandOffEarly = TRUE
    CleanupDependsOnDyingProcess = FALSE

INVARIANTS
    TypeOK
    ToolCallOnlyOnReadyScreen
    NoScreenWithoutSession
    NoSessionWithoutAgent
    TeardownAtMostOnce
    DaemonNeverStuck

PROPERTIES
    SessionsAreIndependent
    ResourcesEventuallyReleased
    StartingSessionBecomesReady
