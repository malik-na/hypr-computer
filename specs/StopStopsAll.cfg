\* Past bug: Stop on one agent's notice stops every agent. TLC must report StopOnlyItsOwn.
SPECIFICATION Spec

CONSTANTS
    Sessions = {s1, s2}
    CloseOnEnd = FALSE
    ForgetLateAnswer = FALSE
    WaitForever = FALSE
    StopStopsAll = TRUE

INVARIANTS
    TypeOK
    AtMostOneNotice
    NoNoticeOutlivesItsSession
    StopOnlyItsOwn

PROPERTIES
    StopOnlyLive
    UserIsTold
    NoticeGoes
    StopTakesEffect

\* Each session opens and ends once at most, so a run can end: that is not a deadlock.
CHECK_DEADLOCK FALSE
