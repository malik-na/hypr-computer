[package]
name = "screen"
description = "An agent's screen: the compositor process, and the daemon's handle on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "hypr-computer-screen"
path = "src/compositor/main.rs"

[dependencies]
domain.workspace = true
png = "0.17.16"
ports.workspace = true
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde_json.workspace = true
# Smithay is 0.x and changes its API between releases: pinned, upgraded on purpose.
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman"] }
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }

[lints]
workspace = true
