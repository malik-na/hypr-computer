[package]
name = "workspace-tests"
description = "Black-box tests that drive the real daemon and shim, and checks on the workspace's structure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"

[[test]]
name = "daemon_shim"
path = "daemon_shim.rs"

[[test]]
name = "socket_activation"
path = "socket_activation.rs"

[[test]]
name = "architecture"
path = "architecture.rs"

[[test]]
name = "screen"
path = "screen.rs"

[[test]]
name = "launch_app"
path = "launch_app.rs"

[[test]]
name = "input"
path = "input.rs"

# The tiny Wayland app the tests put on a screen (see support/app.rs).
[[bin]]
name = "hc-test-app"
path = "app/main.rs"

[dependencies]
serde_json.workspace = true
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }

[dev-dependencies]
base64 = "0.22.1"
command-fds = "0.3.3"
png = "0.17.16"
toml = "0.9"

[lints]
workspace = true
