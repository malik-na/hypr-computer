[package]
name = "workspace-tests"
description = "Black-box tests that drive the real daemon and shim, and checks on the workspace's structure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "lib.rs"

[[test]]
name = "daemon_shim"
path = "daemon_shim.rs"

[[test]]
name = "socket_activation"
path = "socket_activation.rs"

[[test]]
name = "architecture"
path = "architecture.rs"

[[test]]
name = "screen"
path = "screen.rs"

[[test]]
name = "launch_app"
path = "launch_app.rs"

[[test]]
name = "input"
path = "input.rs"

# #25, written from the spec by an independent test agent; helpers in spec25/.
[[test]]
name = "launch_app_spec"
path = "launch_app_spec.rs"

[[test]]
name = "click_spec"
path = "click_spec.rs"

[[test]]
name = "move_spec"
path = "move_spec.rs"

[[test]]
name = "type_spec"
path = "type_spec.rs"

[[test]]
name = "key_spec"
path = "key_spec.rs"

[[test]]
name = "scroll_spec"
path = "scroll_spec.rs"

[[test]]
name = "drag_spec"
path = "drag_spec.rs"

[[test]]
name = "bad_arguments_spec"
path = "bad_arguments_spec.rs"

[[test]]
name = "not_ready_spec"
path = "not_ready_spec.rs"

[[test]]
name = "input_isolation_spec"
path = "input_isolation_spec.rs"

[[test]]
name = "daemon_signal_spec"
path = "daemon_signal_spec.rs"

[[test]]
name = "shim_exit_spec"
path = "shim_exit_spec.rs"

[[test]]
name = "desktop"
path = "desktop.rs"

[[test]]
name = "live_view"
path = "live_view.rs"

# #27, written from the spec by an independent test agent; helpers in view_support/.
[[test]]
name = "view_harness"
path = "view_harness.rs"

[[test]]
name = "view_placement"
path = "view_placement.rs"

[[test]]
name = "view_label"
path = "view_label.rs"

[[test]]
name = "view_mirror"
path = "view_mirror.rs"

[[test]]
name = "view_watch_only"
path = "view_watch_only.rs"

[[test]]
name = "view_tiling"
path = "view_tiling.rs"

[[test]]
name = "view_lifecycle"
path = "view_lifecycle.rs"

[[test]]
name = "view_watch_command"
path = "view_watch_command.rs"

# #28, written from the spec by an independent test agent; helpers in spec28/.
[[test]]
name = "stop_all_spec"
path = "stop_all_spec.rs"

[[test]]
name = "stop_one_spec"
path = "stop_one_spec.rs"

# The tiny Wayland app the tests put on a screen (see support/app.rs).
[[bin]]
name = "hc-test-app"
path = "app/main.rs"

[dependencies]
serde_json.workspace = true
tempfile = "3.27.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
xkbcommon = "0.8.0"

[dev-dependencies]
adapters.workspace = true
base64 = "0.22.1"
command-fds = "0.3.3"
png = "0.17.16"
ports.workspace = true
tokio.workspace = true
# The host compositor the live views open on (see view_support/host.rs).
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "renderer_pixman"] }
toml = "0.9"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
xkbcommon = { version = "0.8.0", default-features = false }

[lints]
workspace = true
